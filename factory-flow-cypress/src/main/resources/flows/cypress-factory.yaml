id: cypress-factory
name: Cypress Factory
version: 1.0.0
triggers:
  - event_type: manual
input_schema:
  required: [issueKey]
output_schema:
  artifacts: [test_plan.md]
retry_policy:
  max_attempts: 3
  backoff_seconds: [30, 120, 300]
agent_chain:
  - step_id: triage
    type: AGENT
    worker_id: triage-agent
    inputs: ["$trigger"]
    outputs: [scope_manifest.md]

  - step_id: context-load
    type: AGENT
    worker_id: cypress-context-loader
    inputs: [scope_manifest.md]
    outputs: [context.md]

  - step_id: fragment-scan
    type: AGENT
    worker_id: cypress-fragment-scanner
    inputs: [context.md, scope_manifest.md]
    outputs: [fragment_library.md]

  - step_id: examples-load
    type: AGENT
    worker_id: cypress-examples-loader
    inputs: []
    outputs: [examples.md]

  - step_id: coverage-load
    type: AGENT
    worker_id: cypress-coverage-loader
    inputs: [context.md]
    outputs: [existing_coverage.md]

  - step_id: scenario-analysis
    type: AGENT
    worker_id: cypress-scenario-analysis
    inputs: [scope_manifest.md, context.md, existing_coverage.md]
    outputs: [scenario_list.md]

  - step_id: gate-0-scenarios
    type: HITL_GATE
    gate:
      gate_id: gate-0-scenarios
      title: "QA: confirm test scenario coverage"
      review_instructions: >
        Review proposed scenarios. Add missing coverage, remove out-of-scope items,
        adjust journey vs atomic shape. Amend scenario_list.md — test-spec will generate
        cases for exactly the scenarios confirmed here.

        The coverage matrix shows AC → scenario mapping and flags EXISTING cases.
        Remove EXISTING rows unless the story changes that behaviour — new cases for
        already-covered scenarios create duplicates in TestRail.

        The frontmatter field `testrail_section` shows the suggested TestRail section for
        these cases. Edit the path string if the suggestion is wrong. Accepted formats:
        a path string using › | > → as separators, or a numeric section ID. Delete the
        field to fall back to the configured default section.
      reviewed_artifacts: [scenario_list.md, scope_manifest.md, context.md, existing_coverage.md]

  - step_id: test-spec
    type: AGENT
    worker_id: cypress-e2e-spec-agent
    inputs: [scope_manifest.md, context.md, fragment_library.md, examples.md, scenario_list.md, existing_coverage.md]
    optional_inputs: [hitl_feedback.md, previous_test_plan.md]
    outputs: [test_plan.md, testcase_review.md]

  - step_id: gate-1-review
    type: HITL_GATE
    gate:
      gate_id: gate-1-test-cases
      title: "QA review: test cases"
      review_instructions: >
        Review the generated test cases for coverage, correctness, and
        automatability. Verify that the automatable flag is accurate and that
        automation notes reference real helpers from the fragment library where
        applicable. Edit the test plan inline (AMEND) if cases need changes.

        testcase_review.md shows the automated quality review result — how many
        iterations were needed and any remaining issues the reviewer flagged.

        The `testrail_section` in scenario_list.md frontmatter controls which
        TestRail folder receives the cases. Amend it here if the gate-0 suggestion
        was wrong. Accepted formats: a path string using › | > → as separators,
        or a numeric section ID. Delete the field to fall back to the configured default.

        If the cases need a full re-write: use "Reject and Re-generate" — enter your
        feedback, and a new generation starts immediately preserving all gate-0 decisions.
        "Reject" (without re-generate) terminates the execution permanently.
      reviewed_artifacts: [test_plan.md, testcase_review.md, scenario_list.md, scope_manifest.md, context.md, hitl_feedback.md, previous_test_plan.md]

  - step_id: testrail-sync
    type: AGENT
    worker_id: cypress-testrail-sync
    inputs: [test_plan.md, scope_manifest.md, scenario_list.md]
    outputs: [test_plan.md]
