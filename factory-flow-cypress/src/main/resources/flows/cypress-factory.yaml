id: cypress-factory
name: Cypress Factory
version: 2.2.0
triggers:
  - event_type: manual
input_schema:
  required: [issueKey]
output_schema:
  artifacts: [test_plan.md, testrail_cases.json, automation_report.md, automation_publish.json]
retry_policy:
  max_attempts: 3
  backoff_seconds: [30, 120, 300]
agent_chain:
  - step_id: testcase-gen
    type: AGENT
    worker_id: cypress-testcase-gen-agent
    inputs: ["$trigger"]
    optional_inputs: [test_plan.md, hitl_feedback.md]
    outputs: [test_plan.md]

  - step_id: gate-1-review
    type: HITL_GATE
    gate:
      gate_id: gate-1-test-cases
      title: "QA review: test cases"
      review_instructions: |
        Everything is in test_plan.md, in three sections. Read them in this order:

        - "# Analysis" — the area that was detected and why, the context file that was
          loaded, the Key Business Rules the story touches, and the AC to scenario coverage
          matrix. Read this first: it tells you whether the SCOPE is right, which is the one
          thing no automated check can judge.
        - "# Test Cases" — exactly what will be posted to TestRail, nothing else.
        - "# Review" — the automated reviewer's verdict, plus any issues it could not fix
          within its retry budget.

        Findings in "# Review" come from two places, merged into one list: the reviewer agent
        applying the checklist in its prompt, and a handful of rules enforced by deterministic
        code instead. The prompt linked below says which are which, and where to change them.

        The YAML frontmatter carries the four fields TestRail sync reads. Correct them here
        if they are wrong:

        - testrail_section — the destination folder. Either a path string (separators › | > →)
          or a numeric section ID. It was already checked against TestRail; if it could not be
          resolved this falls back to the configured default.
        - refs — the References field on every created case. The originating issue key is
          always kept even if you remove it.
        - team, ecs_story — dev team attribution and the story-level ECS classification.

        Watch for a ⚠️ line at the top of "# Analysis": it means the run degraded somehow —
        a context file was missing, the fragment library was unavailable, or the skill text
        changed in a way the factory's prompt no longer matches.
      reviewed_artifacts: [test_plan.md, hitl_feedback.md]
      reference_prompts: [cypress-testcase-reviewer]

  - step_id: testrail-sync
    type: AGENT
    worker_id: cypress-testrail-sync
    inputs: [test_plan.md]
    outputs: [test_plan.md, testrail_cases.json]

  # Automation (module factory-flow-test-automation). Runs on the cases created above, or - started
  # by partial-run at automation-select with {"testCaseIds": [...]} - on any existing cases.
  # "automate": false in the payload (or FACTORY_CYPRESS_AUTOMATION_ENABLED=false) turns it off.
  - step_id: automation-select
    type: AGENT
    worker_id: cypress-automation-select
    inputs: ["$trigger"]
    optional_inputs: [testrail_cases.json]
    outputs: [automation_cases.json]

  - step_id: automate
    type: AGENT
    worker_id: cypress-automate-cases
    inputs: [automation_cases.json]
    optional_inputs: [hitl_feedback.md]
    outputs: [automation_report.md, automation_results.json]

  - step_id: gate-2-review
    type: HITL_GATE
    gate:
      gate_id: gate-2-autotests
      title: "AQA review: generated autotests"
      review_instructions: |
        automation_report.md lists, per case: the spec that was written, the review agent's
        verdict and findings, and both agents' summaries. The changes are committed locally on
        the branch named at the top, one commit per case, in the automation workspace - open the
        diff there (the report gives the git log command) before approving. A failed case's
        changes are discarded. Nothing has been pushed.

        - Approve - open a pull request with these specs in FACTORY_CYPRESS_TARGET_REPO (a fork
          of stripes-testing). Without it set, approving just finishes the run.
        - Reject and Re-generate - re-runs the automation for the same cases with your notes as
          feedback, on a fresh branch from master.
        - "Automation disabled" / "No automatable cases" - nothing to review; approve to finish.

        Before each case's commit the TAF's own pre-commit checks ran (lint-staged: prettier
        --write, then stripes-lint --fix). Lint errors they could not fix are flagged at the top
        of the report and listed per case - nothing fixes them automatically yet.

        Spec runs are off unless FACTORY_CYPRESS_AUTOMATION_RUN_SPECS=true, so "spec not run"
        is expected: the review was static.
      reviewed_artifacts: [automation_report.md, hitl_feedback.md]

  - step_id: publish
    type: AGENT
    worker_id: cypress-automation-publish
    inputs: [automation_results.json, automation_cases.json]
    outputs: [automation_publish.json]
