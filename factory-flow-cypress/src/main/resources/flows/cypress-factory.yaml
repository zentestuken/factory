id: cypress-factory
name: Cypress Factory
version: 2.0.0
triggers:
  - event_type: manual
input_schema:
  required: [issueKey]
output_schema:
  artifacts: [test_plan.md]
retry_policy:
  max_attempts: 3
  backoff_seconds: [30, 120, 300]
agent_chain:
  - step_id: testcase-gen
    type: AGENT
    worker_id: cypress-testcase-gen-agent
    inputs: ["$trigger"]
    optional_inputs: [test_plan.md, hitl_feedback.md]
    outputs: [test_plan.md]

  - step_id: gate-1-review
    type: HITL_GATE
    gate:
      gate_id: gate-1-test-cases
      title: "QA review: test cases"
      review_instructions: |
        Everything is in test_plan.md, in three sections. Read them in this order:

        - "# Analysis" — the area that was detected and why, the context file that was
          loaded, the Key Business Rules the story touches, and the AC to scenario coverage
          matrix. Read this first: it tells you whether the SCOPE is right, which is the one
          thing no automated check can judge.
        - "# Test Cases" — exactly what will be posted to TestRail, nothing else.
        - "# Review" — the automated reviewer's verdict, plus any issues it could not fix
          within its retry budget.

        Findings in "# Review" come from two places, merged into one list: the reviewer agent
        applying the checklist in its prompt, and a handful of rules enforced by deterministic
        code instead. The prompt linked below says which are which, and where to change them.

        The YAML frontmatter carries the four fields TestRail sync reads. Correct them here
        if they are wrong:

        - testrail_section — the destination folder. Either a path string (separators › | > →)
          or a numeric section ID. It was already checked against TestRail; if it could not be
          resolved this falls back to the configured default.
        - refs — the References field on every created case. The originating issue key is
          always kept even if you remove it.
        - team, ecs_story — dev team attribution and the story-level ECS classification.

        Watch for a ⚠️ line at the top of "# Analysis": it means the run degraded somehow —
        a context file was missing, the fragment library was unavailable, or the skill text
        changed in a way the factory's prompt no longer matches.
      reviewed_artifacts: [test_plan.md, hitl_feedback.md]
      reference_prompts: [cypress-testcase-reviewer]

  - step_id: testrail-sync
    type: AGENT
    worker_id: cypress-testrail-sync
    inputs: [test_plan.md]
    outputs: [test_plan.md]
